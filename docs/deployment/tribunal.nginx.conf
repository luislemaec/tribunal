# Plantilla para el proxy unico Nginx -> WildFly en el mismo servidor.
# Requiere Nginx >= 1.19.3 para proxy_cookie_flags.
# Sustituir el virtual host existente, no agregar otro con el mismo server_name.
# Incluir este archivo dentro del contexto http de Nginx.
map $uri $tec_qr_cliente {
    default "";
    /acceso-acta $binary_remote_addr;
    /acceso-acta/canjear $binary_remote_addr;
}
limit_req_zone $tec_qr_cliente zone=tec_qr:10m rate=30r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tribunal.conpociiech.org;

    ssl_certificate /etc/letsencrypt/live/tribunal.conpociiech.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tribunal.conpociiech.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    # El token impreso nunca llega en la query al access log de WildFly.
    # No capturar Location en APM. La auditoria funcional se realiza al canjear.
    location = /acceso-acta {
        access_log off;
        error_log /dev/null;
        add_header Cache-Control "no-store" always;
        if ($args ~ "^token=([A-Za-z0-9_-]{43})$") {
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            return 303 "https://tribunal.conpociiech.org/acceso-acta#t=$1";
        }
        if ($args != "") { return 400; }
        limit_req zone=tec_qr burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host tribunal.conpociiech.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host tribunal.conpociiech.org;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_cookie_flags JSESSIONID secure httponly samesite=lax;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=tec_qr burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host tribunal.conpociiech.org;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx es el unico proxy publico: sobrescribir la cadena del cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host tribunal.conpociiech.org;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";

        proxy_cookie_flags JSESSIONID secure httponly samesite=lax;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tribunal.conpociiech.org;
    return 301 https://tribunal.conpociiech.org$request_uri;
}
