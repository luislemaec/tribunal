<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <f:metadata>
        <f:viewParam name="token" value="#{restablecerClaveController.token}" />
    </f:metadata>
    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
        </f:facet>
        <link rel="shortcut icon" href="#{request.contextPath}/resources/img/favicon.ico" />
        <title>#{msg['app.sistema']} - #{msg['form.restablecerClave.title']}</title>
    </h:head>
    <h:body styleClass="login-body">
        <!-- Página pública: se llega con un token sin haber iniciado sesión, así que el
             logo lleva al login y no al dashboard. -->
        <div class="login-topbar"><h:link outcome="/login" class="logo"><p:graphicImage name="images/ecuador-logo.png" library="ecuador-layout"/></h:link></div>
        <h:form id="frmRestablecerClave">
            <div class="grid">
                <div class="col-12 md:col-6 lg:col-4 md:col-offset-3 lg:col-offset-4 mt-8">
                    <div class="card">
                        <h5><b>#{msg['form.restablecerClave.header']}</b></h5>
                        <p:growl id="mensajes" showDetail="true"/>
                        <p:staticMessage severity="info" summary="#{msg['form.restablecerClave.info.title']}"
                                         detail="#{msg['form.restablecerClave.info.detail']}" style="width:100%"/>
                        <div class="ui-fluid mt-3">
                            <p:outputLabel for="clave" styleClass="block text-700 font-medium text-sm mb-1"
                                           value="#{msg['form.cambioClave.label.password.new']}"/>
                            <p:password id="clave" value="#{restablecerClaveController.clave1}" required="true"
                                        requiredMessage="#{msg['msg.password.required']}" toggleMask="true"
                                        styleClass="w-full"
                                        placeholder="#{msg['form.cambioClave.placeholder.password.new']}"/>

                            <p:outputLabel for="confirmacion" styleClass="block text-700 font-medium text-sm mt-3 mb-1"
                                           value="#{msg['form.cambioClave.label.password.confirm']}"/>
                            <p:password id="confirmacion" value="#{restablecerClaveController.clave2}" required="true"
                                        requiredMessage="#{msg['msg.password.required']}" toggleMask="true"
                                        styleClass="w-full"
                                        placeholder="#{msg['form.cambioClave.placeholder.password.confirm']}"/>

                            <!-- Misma política que el cambio autenticado, mismo fragmento. -->
                            <ui:include src="/WEB-INF/requisitosClave.xhtml">
                                <ui:param name="campoClave" value="frmRestablecerClave:clave"/>
                                <ui:param name="idBloque" value="requisitosRestablecerClave"/>
                            </ui:include>
                        </div>
                        <h:inputHidden id="token" value="#{restablecerClaveController.token}"/>
                        <div class="text-center mt-3"><p:commandButton value="#{msg['form.cambioClave.btn.save']}" action="#{restablecerClaveController.restablecer}" ajax="false" styleClass="ui-button-info"/></div>
                    </div>
                </div>
            </div>
        </h:form>
        <h:outputStylesheet name="css/primeflex.min.css" library="ecuador-layout" />
        <h:outputStylesheet name="css/layout-#{guestPreferences.theme}.css" library="ecuador-layout" />
    </h:body>
</html>
