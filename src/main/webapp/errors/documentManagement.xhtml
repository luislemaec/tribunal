<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" template="/errors/error-template.xhtml">
    <ui:define name="content">
        <div class="error-alfresco">
            <div class="ui-messages ui-widget">
                <div class="ui-messages-error ui-corner-all">
                    <span class="ui-messages-error-icon"></span>
                    <ul>
                        <li><span class="ui-messages-error-summary">#{msg['error.documentManagement.summary']}</span> <span class="ui-messages-error-detail">#{msg['error.documentManagement.detail']}</span></li>
                    </ul>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
