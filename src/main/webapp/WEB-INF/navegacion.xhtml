<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:ui="jakarta.faces.facelets" 
      xmlns:p="http://primefaces.org/ui" >

    <ui:composition>
        <!-- HttpSession expresa el tiempo en segundos; PrimeFaces usa milisegundos. -->
        <p:idleMonitor timeout="#{loginBean.tiempoSession * 1000}"
                       rendered="#{loginBean.loggedIn and loginBean.tiempoSession gt 0}">
            <p:ajax event="idle" listener="#{loginBean.cerrarSessionExpirada()}" />
        </p:idleMonitor>
    </ui:composition>
</html>
