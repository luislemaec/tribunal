<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      lang="es">

    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous" href="#{resource['ecuador-layout:fonts/montserrat-v12-latin-ext_latin-regular.woff2']}"/>
            <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous" href="#{resource['ecuador-layout:fonts/montserrat-latin-ext_latin-500.woff2']}"/>
        </f:facet>
        <title><ui:insert name="title">#{msg['app.sistema.nombre.completo']}</ui:insert></title>
        
        <ui:include src="/WEB-INF/favicon.xhtml"/>

        <script type="text/javascript">
            (function () {
                var applied = false;
                function applyJqueryPolyfills() {
                    if (applied) return true;
                    if (typeof window.jQuery === 'undefined') return false;
                    if (typeof window.jQuery.isFunction !== 'function') {
                        window.jQuery.isFunction = function (obj) {
                            return typeof obj === 'function';
                        };
                    }
                    if (typeof window.jQuery.parseJSON !== 'function') {
                        window.jQuery.parseJSON = function (data) {
                            return JSON.parse(data);
                        };
                    }
                    applied = true;
                    return true;
                }
                // Intento inmediato (por si jQuery ya está cargado).
                if (!applyJqueryPolyfills()) {
                    // Polling ligero hasta que jQuery exista. Máx ~3s.
                    var tries = 0;
                    var interval = setInterval(function () {
                        tries++;
                        if (applyJqueryPolyfills() || tries > 300) {
                            clearInterval(interval);
                        }
                    }, 10);
                }
                // Defensa adicional: aplicar también en DOMContentLoaded.
                if (document.addEventListener) {
                    document.addEventListener('DOMContentLoaded', applyJqueryPolyfills);
                }
            })();
        </script>

        <h:outputScript name="js/layout.js" library="ecuador-layout" />

        <h:outputScript name="js/tribunal-fontsize.js"       library="demo" target="head"/>
        <h:outputStylesheet name="css/nprogress.min.css"     library="demo"/>
        <h:outputStylesheet name="css/tribunal-globals.css"  library="demo"/>

        <h:outputScript name="js/nprogress.min.js"           library="demo"/>
        <h:outputScript name="js/jquery.inputmask.min.js"    library="demo"/>
        <h:outputScript name="js/tribunal-globals.js"        library="demo"/>
        <!-- =============================================================== -->

        <ui:insert name="head"/>
    </h:head>

    <h:body styleClass="#{guestPreferences.inputStyleClass}">
        <div class="layout-wrapper #{guestPreferences.menuMode} layout-menu-#{guestPreferences.menuColor} #{guestPreferences.orientationRTL ? 'layout-rtl' : null}">
            <ui:include src="/WEB-INF/navegacion.xhtml" />
            <ui:include src="/WEB-INF/status.xhtml" />
            <ui:include src="/WEB-INF/globals.xhtml" />

            <ui:include src="./toopbar.xhtml" />
            <ui:include src="./menu.xhtml"/>
            <ui:include src="./config.xhtml" />            


            <div class="layout-main">
                <div class="route-bar">
                    <!-- Migas de pan: Inicio / módulo / página. Cada página declara ui:param tecModulo y tecPagina
                         (el módulo es solo texto; la página actual no es enlace). El separador lo pone el CSS. -->
                    <div class="route-bar-breadcrumb" role="navigation" aria-label="#{msg['nav.migas']}">
                        <ul>
                            <li>
                                <a href="dashboard.jsf" title="#{msg['nav.inicio']}" aria-label="#{msg['nav.inicio']}">
                                    <i class="pi pi-home" aria-hidden="true"/>
                                </a>
                            </li>
                            <ui:fragment rendered="#{not empty tecModulo}"><li>#{tecModulo}</li></ui:fragment>
                            <ui:fragment rendered="#{not empty tecPagina}"><li aria-current="page">#{tecPagina}</li></ui:fragment>
                        </ul>
                    </div>
                </div>

                <div class="layout-content">
                    <ui:insert name="content"/>
                </div>

                <div class="layout-footer">
                    <ui:include src="./footer.xhtml"/>
                </div>
            </div>

            <p:ajaxStatus styleClass="layout-ajax-loader">
                <f:facet name="start">
                    <i class="pi pi-spin pi-spinner layout-ajax-loader-icon" aria-hidden="true"/>
                </f:facet>

                <f:facet name="complete">
                    <h:outputText value="" />
                </f:facet>
            </p:ajaxStatus>
        </div>
        <h:outputStylesheet name="css/primeflex.min.css" library="ecuador-layout" />
        <h:outputStylesheet name="css/layout-#{guestPreferences.theme}.css" library="ecuador-layout" />
    </h:body>

</html>
