<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <div class="layout-topbar">
        <a href="#" id="topbar-menu-button">
            <i class="pi pi-angle-left arrow"/>
            <i class="pi pi-angle-up mobile"/>
        </a>

        <h:form id="frmTopbarSearch" styleClass="topbar-search-form">
            <div class="search-input topbar-menu-search">
                <i class="pi pi-search icon-search"/>
                <p:inputText id="menuSearch"
                             value="#{loginBean.filtroMenu}"
                             placeholder="#{msg['topbar.search.menu']}"
                             title="#{msg['topbar.search.menu.title']}">
                    <p:ajax event="keyup"
                            listener="#{loginBean.filtrarMenuPrincipal}"
                            process="@this"
                            update=":menuform clearSearchPanel"
                            delay="350"/>
                </p:inputText>
                <p:outputPanel id="clearSearchPanel" layout="inline">
                    <p:commandButton icon="pi pi-times"
                                     title="#{msg['topbar.search.clear']}"
                                     actionListener="#{loginBean.limpiarFiltroMenu}"
                                     process="@this"
                                     update=":menuform :frmTopbarSearch"
                                     rendered="#{loginBean.filtroMenuActivo}"
                                     styleClass="ui-button-rounded ui-button-text ui-button-plain topbar-search-clear"/>
                </p:outputPanel>
            </div>
        </h:form>

        <h:link outcome="/dashboard" styleClass="logo-container">
            <p:graphicImage name="images/ecuador-logo.png" library="ecuador-layout" />
        </h:link>

        <a id="topbar-profile-menu-button" href="#">
            <span class="topbar-perfil">
                <span class="topbar-perfil__nombre">
                    #{empty loginBean.usuario.personaNombres ? loginBean.usuario.username : loginBean.usuario.personaNombres}
                </span>
                <span class="topbar-perfil__roles">
                    <!-- El prefijo 'SITEC-' es interno del dominio de seguridad; no se muestra. -->
                    <ui:repeat value="#{loginBean.roles}" var="rol">
                        <span class="topbar-perfil__rol topbar-perfil__rol--#{(rol.startsWith('SITEC-') ? rol.substring(6) : rol).toLowerCase()}">
                            #{(rol.startsWith('SITEC-') ? rol.substring(6) : rol).replace('-', ' ')}
                        </span>
                    </ui:repeat>
                </span>
            </span>
            <span class="topbar-profile-icon" aria-hidden="true">
                <i class="pi pi-user"/>
            </span>
            <i class="pi pi-caret-down"/>
        </a>

        <ul id="topbar-usermenu" class="fadeInDown animated">
            <li>
                <h:form id="formLogoutBar" rendered="#{loginBean.loggedIn}">
                    <p:commandLink
                        actionListener="#{loginBean.logout()}" process="@this">
                        <i class="pi pi-fw pi-sign-out"></i>
                        <span class="topbar-item-name">#{msg['topbar.logout']}</span>
                    </p:commandLink>                    
                </h:form>
            </li>
        </ul>
    </div>

</ui:composition>
