<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <!-- Encabezado estándar de página: un único <h1> + descripción. Parámetros: titulo, descripcion, icono (clase PrimeIcons).
         Zona opcional "contexto" para datos complementarios (p. ej. proceso activo), que no se repiten en título ni descripción. -->
    <div class="tec-page-header">
        <div class="tec-page-header__icon" aria-hidden="true">
            <i class="pi #{icono}"/>
        </div>
        <div class="min-w-0">
            <h1>#{titulo}</h1>
            <p>#{descripcion}</p>
        </div>
        <ui:insert name="contexto"/>
    </div>
</ui:composition>
