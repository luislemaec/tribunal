<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="jakarta.faces.html" 
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:pe="http://primefaces.org/ecuador">

    <div class="layout-sidebar">
        <div class="layout-menu-title">#{msg['menu.titulo.principal']}</div>
        <h:form id="menuform" rendered="#{loginBean.loggedIn}">
            <p:outputPanel styleClass="menu-search-empty" rendered="#{loginBean.menuFiltradoSinResultados}">
                <i class="pi pi-search"></i>
                <span>#{msg['menu.busqueda.sinResultados']}</span>
            </p:outputPanel>
            <pe:menu widgetVar="me"
                     model="#{loginBean.menuModel}"
                     rendered="#{not loginBean.menuFiltradoSinResultados}"/>
        </h:form>
    </div>
</ui:composition>
