<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">#{msg['pagina.perfil.titulo']}</ui:define>

        <ui:param name="tecPagina" value="#{msg['pagina.perfil.migas']}"/>

    <ui:define name="content">

        <ui:include src="/WEB-INF/pageHeader.xhtml">
            <ui:param name="icono" value="pi-user"/>
            <ui:param name="titulo" value="#{msg['pagina.perfil.titulo']}"/>
            <ui:param name="descripcion" value="#{msg['pagina.perfil.descripcion']}"/>
        </ui:include>

        <h:form id="frmPerfil">
            <div class="surface-card shadow-1 border-round-lg p-4">
                <div class="flex justify-content-center align-items-center" style="min-height:10rem">
                    <span class="text-500 text-lg">
                        <i class="pi pi-info-circle mr-2"></i>
                        Módulo de perfil en construcción.
                    </span>
                </div>
            </div>
        </h:form>

    </ui:define>
</ui:composition>
