<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <meta name="description" content="" />
            <meta name="author" content="Luis Lema" />
        </f:facet>
        <ui:include src="/WEB-INF/favicon.xhtml"/>
        <title>#{msg['app.sistema']} - #{msg['form.cambioClave.title']}</title>
        <h:outputScript name="js/layout.js" library="ecuador-layout" />
        <h:outputScript name="js/prism.js" library="ecuador-layout"/>
    </h:head>

    <h:body styleClass="login-body">
        <div class="login-topbar">
            <h:form id="frmCancelarCambioSuperior">
                <p:commandLink action="#{loginBean.cancelarCambioClaveObligatorio}"
                               ajax="false" immediate="true" process="@this" styleClass="logo">
                    <p:graphicImage name="images/ecuador-logo.png" library="ecuador-layout"/>
                </p:commandLink>
            </h:form>
        </div>
        <h:form id="frmCambioContrasenia">
            <p:growl id="growlCambioClave" life="4000" />
            <div class="grid " >
                <div class="col-12 md:col-6 lg:col-4 md:col-offset-3 lg:col-offset-4 mt-8">
                    <div class="card">
                        <h5><b>#{msg['form.cambioClave.header']}</b></h5>
                        <p:staticMessage severity="info"
                                         summary="#{msg['form.cambioClave.msg.info.title']}"
                                         detail="#{msg['form.cambioClave.msg.info.detail']}"
                                         style="width: 100%"/>

                        <div class="col-12 ui-fluid">
                            <p:outputLabel for="claveAnterior" styleClass="block text-700 font-medium text-sm mt-3 mb-1"
                                           value="#{msg['form.cambioClave.label.password.old']}"/>
                            <p:password styleClass="w-full" id="claveAnterior" required="true"
                                        value="#{cambioClaveController.claveTemporal}"
                                        validatorMessage="#{msg['msg.passwordOld.validator']}"
                                        requiredMessage="#{msg['msg.password.required']}"
                                        toggleMask="true"
                                        placeholder="#{msg['form.cambioClave.label.password.old']}"/>

                            <p:outputLabel for="password" styleClass="block text-700 font-medium text-sm mt-3 mb-1"
                                           value="#{msg['form.cambioClave.label.password.new']}"/>
                            <p:password styleClass="w-full" id="password" required="true"
                                        value="#{cambioClaveController.clave1}"
                                        validatorMessage="#{msg['msg.password.validator']}"
                                        requiredMessage="#{msg['msg.password.required']}"
                                        toggleMask="true"
                                        placeholder="#{msg['form.cambioClave.placeholder.password.new']}"/>

                            <p:outputLabel for="password2" styleClass="block text-700 font-medium text-sm mt-3 mb-1"
                                           value="#{msg['form.cambioClave.label.password.confirm']}"/>
                            <p:password styleClass="w-full" id="password2" required="true"
                                        value="#{cambioClaveController.clave2}"
                                        validatorMessage="#{msg['msg.password.validator']}"
                                        requiredMessage="#{msg['msg.password.required']}"
                                        toggleMask="true"
                                        placeholder="#{msg['form.cambioClave.placeholder.password.confirm']}"/>

                            <!-- Requisitos reales de la política, con marca en tiempo real.
                                 La validación definitiva sigue siendo la del servidor. -->
                            <ui:include src="/WEB-INF/requisitosClave.xhtml">
                                <ui:param name="campoClave" value="frmCambioContrasenia:password"/>
                                <ui:param name="idBloque" value="requisitosCambioClave"/>
                            </ui:include>
                        </div>

                        <div align='center'>
                            <p:commandButton value="#{msg['form.cambioClave.btn.save']}"
                                             action="#{cambioClaveController.cambiarClave()}"
                                             ajax="false" styleClass="ui-button-info"/>
                            <p:divider/>
                            <p:commandLink value="#{msg['form.cambioClave.btn.back']}"
                                           action="#{loginBean.cancelarCambioClaveObligatorio}"
                                           ajax="false" immediate="true" process="@this"/>
                        </div>
                    </div>

                </div>         
            </div>
        </h:form>
        <h:outputStylesheet name="css/primeflex.min.css" library="ecuador-layout" />

        <h:outputStylesheet name="css/demo.css" library="demo"/>
        <h:outputStylesheet name="css/layout-#{guestPreferences.theme}.css" library="ecuador-layout" />
    </h:body>
</html>
