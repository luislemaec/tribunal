<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="jakarta.tags.core">

    <ui:define name="title">#{msg['pagina.permisos.titulo']}</ui:define>

        <ui:param name="tecModulo" value="#{msg['nav.modulo.seguridad']}"/>
    <ui:param name="tecPagina" value="#{msg['pagina.permisos.migas']}"/>

    <ui:define name="content">

        <ui:include src="/WEB-INF/pageHeader.xhtml">
            <ui:param name="icono" value="pi-lock"/>
            <ui:param name="titulo" value="#{msg['pagina.permisos.titulo']}"/>
            <ui:param name="descripcion" value="#{msg['pagina.permisos.descripcion']}"/>
        </ui:include>

        <h:form id="frmPermisos">

            <!-- SELECTOR DE ROL -->
            <div class="surface-card shadow-1 border-round-lg p-3 mb-3">
                <div class="flex align-items-center gap-2 mb-3">
                    <i class="pi pi-key text-500"></i>
                    <span class="font-semibold text-700">Seleccione el rol para gestionar sus permisos</span>
                </div>
                <div class="formgrid grid">
                    <div class="field col-12 md:col-6">
                        <label for="rol" class="font-medium text-700 text-sm">ROL</label>
                        <p:selectOneMenu id="rol" value="#{permisosController.rolSeleccionado.id}"
                                         filter="true" filterMatchMode="startsWith" styleClass="w-full">
                            <f:selectItem itemLabel="— Seleccione un rol —" itemValue=""/>
                            <f:selectItems value="#{permisosController.roles}" var="rol"
                                           itemLabel="#{rol.nombre}" itemValue="#{rol.id}"/>
                            <p:ajax event="change" listener="#{permisosController.obtieneMenuPorRol()}"
                                    process="@this" update="frmPermisos"/>
                        </p:selectOneMenu>
                    </div>
                </div>
            </div>

            <!-- TABLA DE PERMISOS (solo si hay un rol seleccionado) -->
            <ui:fragment rendered="#{permisosController.rolSeleccionado.id gt 0}">
                <div class="surface-card shadow-1 border-round-lg p-3">
                    <div class="flex align-items-center gap-2 mb-3">
                        <i class="pi pi-sitemap text-500"></i>
                        <span class="font-semibold text-700">
                            Permisos para el rol:
                            <span class="text-primary-700 font-bold">#{permisosController.rolSeleccionado.nombre}</span>
                        </span>
                    </div>
                    <p:treeTable value="#{permisosController.root}" var="menuRol"
                                 showGridlines="true" id="trTblMenu"
                                 rendered="#{permisosController.root ne null}"
                                 styleClass="ui-datatable-striped ui-datatable-sm">
                        <p:column headerText="Nombre" sortBy="#{menuRol.menu.nombre}"
                                  styleClass="w-auto" responsivePriority="1">
                            <span class="text-sm font-medium text-900">#{menuRol.menu.nombre}</span>
                        </p:column>
                        <p:column headerText="Icono" styleClass="text-center" style="width:5rem" responsivePriority="4">
                            <i class="#{menuRol.menu.icono}" style="font-size:var(--tec-fs-lg)"></i>
                        </p:column>
                        <p:column headerText="#{permisosController.rolSeleccionado.nombre}"
                                  styleClass="text-center" style="width:10rem">
                            <p:selectBooleanCheckbox value="#{menuRol.estado}">
                                <p:ajax event="change" process="@this"
                                        listener="#{permisosController.guardarMenuRol(menuRol)}"/>
                            </p:selectBooleanCheckbox>
                        </p:column>
                    </p:treeTable>
                </div>
            </ui:fragment>

        </h:form>

    </ui:define>
</ui:composition>
