<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <meta name="description" content="" />
            <meta name="author" content="Luis Lema" />
        </f:facet>
        <ui:include src="/WEB-INF/favicon.xhtml"/>
        <title>#{msg['app.sistema']} - #{msg['form.recuperaClave.title']}</title>
        <h:outputScript name="js/layout.js" library="ecuador-layout" />
        <h:outputScript name="js/prism.js" library="ecuador-layout"/>
    </h:head>

    <h:body styleClass="login-body">
        <!-- Página pública: el logo lleva al login, no al dashboard, porque aquí no hay
             sesión iniciada. -->
        <div class="login-topbar">
            <h:link outcome="/login" class="logo">
                <p:graphicImage name="images/ecuador-logo.png" library="ecuador-layout"/>
            </h:link>
        </div>
        <div class="grid">
            <div class="col-12 md:col-8 lg:col-5 md:col-offset-2 lg:col-offset-4 mt-8">
                <!-- El sistema envía un enlace de un solo uso, no la contraseña: el texto
                     lo dice así y no confirma si la cuenta existe. -->
                <div class="card text-center">
                    <i class="pi pi-envelope text-primary" style="font-size:2.5rem"></i>
                    <h5 class="mt-3 mb-2"><b>#{msg['form.recuperaClave.title']}</b></h5>
                    <p class="text-600 mt-0 mb-4">#{msg['form.recuperaClave.detalle']}</p>
                    <p:button value="#{msg['form.olvidoClave.btn.back']}" icon="pi pi-arrow-left"
                              outcome="/login" styleClass="ui-button-outlined ui-button-secondary"/>
                </div>
            </div>
        </div>

        <h:outputStylesheet name="css/primeflex.min.css" library="ecuador-layout" />

        <h:outputStylesheet name="css/demo.css" library="demo"/>
        <h:outputStylesheet name="css/layout-#{guestPreferences.theme}.css" library="ecuador-layout" />
    </h:body>
</html>
