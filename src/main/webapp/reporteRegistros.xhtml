<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">#{msg['pagina.reporteRegistros.titulo']}</ui:define>

    <ui:param name="tecModulo" value="#{msg['nav.modulo.reportes']}"/>
    <ui:param name="tecPagina" value="#{msg['pagina.reporteRegistros.migas']}"/>

    <ui:define name="content">
        <h:outputScript name="js/graficos-tema.js" library="demo" target="head"/>

        <ui:include src="/WEB-INF/pageHeader.xhtml">
            <ui:param name="icono" value="pi-chart-bar"/>
            <ui:param name="titulo" value="#{msg['pagina.reporteRegistros.titulo']}"/>
            <ui:param name="descripcion" value="#{msg['pagina.reporteRegistros.descripcion']}"/>
        </ui:include>

        <!-- Un reporte por pestaña. dynamic="true": cada pestaña se dibuja (y su controlador
             se crea y consulta) solo al abrirla; cache="true" no la vuelve a pedir.
             Para agregar un reporte: un p:tab con su ui:include en WEB-INF/reportes/ y su
             propio controlador; ids con prefijo propio (el tabView es un solo NamingContainer). -->
        <h:form id="frmReporteRegistros">
            <p:tabView id="tabsReportes" widgetVar="wdTabsReportes" dynamic="true" cache="true">
                <p:tab id="tabRegistros" title="#{msg['reporteRegistros.tab.registros']}" titleStyleClass="p-2">
                    <ui:include src="/WEB-INF/reportes/tabRegistros.xhtml"/>
                </p:tab>
                <p:tab id="tabCobertura" title="#{msg['reporteRegistros.tab.cobertura']}" titleStyleClass="p-2">
                    <ui:include src="/WEB-INF/reportes/tabCoberturaPadron.xhtml"/>
                </p:tab>
                <p:tab id="tabIglesias" title="#{msg['reporteRegistros.tab.iglesias']}" titleStyleClass="p-2">
                    <ui:include src="/WEB-INF/reportes/tabIglesias.xhtml"/>
                </p:tab>
                <p:tab id="tabAdministradores" title="#{msg['reporteRegistros.tab.administradores']}" titleStyleClass="p-2">
                    <ui:include src="/WEB-INF/reportes/tabAdministradores.xhtml"/>
                </p:tab>
                <p:tab id="tabActividad" title="#{msg['reporteRegistros.tab.actividad']}" titleStyleClass="p-2">
                    <ui:include src="/WEB-INF/reportes/tabActividad.xhtml"/>
                </p:tab>
            </p:tabView>
        </h:form>
    </ui:define>
</ui:composition>
