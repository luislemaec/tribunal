# Bundle de mensajes \u2014 Sistema Tribunal Electoral (SITEC)
# =============================================================================
# Encoding: ISO-8859-1 con escapes Unicode \uXXXX (formato est\u00e1ndar Java
# .properties). Para caracteres acentuados/especiales se usa \uNNNN.
# Ejemplos: \u00f1=\u00f1   \u00e1=\u00e1   \u00e9=\u00e9   \u00ed=\u00ed   \u00f3=\u00f3   \u00fa=\u00fa
