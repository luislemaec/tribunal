# Por form:   form.<nombre>.<categor\u00eda>.<concreto>
#
# Uso en XHTML:   #{msg['btn.save']}     |   <h:outputText value="#{msg['label.user']}"/>
# Uso en Java :   JsfUtil.getProperty("msg.user.required", true);
#
# Mantener este archivo ORDENADO por secci\u00f3n y ALFAB\u00c9TICO dentro de cada
# secci\u00f3n para facilitar el merge en Git y la localizaci\u00f3n futura.
# =============================================================================


